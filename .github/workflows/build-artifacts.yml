name: Build Multiplatform Artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAR & iOS XCFramework
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/build-artifacts.sh

      - name: Run Unit Tests
        run: |
          ./gradlew :library:allTests

      - name: Build Artifacts (Android AAR & iOS XCFramework)
        run: |
          ./scripts/build-artifacts.sh

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: blescanner-android-aar
          path: library/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: blescanner-ios-xcframework
          path: library/build/XCFrameworks/release/BleSignalScanner.xcframework
          if-no-files-found: error
