name: ble_scanner_flutter
description: "Flutter iOS bridge for BleSignalScanner XCFramework."
version: 0.0.1

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BleScannerFlutterPlugin
